info:
  name: Detail Pickup Retur
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseurl}}/api/driver/pickup-retur/RET-2607250001"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: "const json = res.getBody();\r

        if (json.data && json.data.items && json.data.items[0]) {\r

        \  const item = json.data.items[0];\r

        \  if (item.awb_no) pm.collectionVariables.set('stt_number', item.awb_no);\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  SP: sp_driver_pickup_retur_detail_json

  next_action: start_trip | arrived
